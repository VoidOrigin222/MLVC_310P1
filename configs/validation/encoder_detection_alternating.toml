# Repeated 1080P bus/person fixture -> detector + ULBVC -> RTP.
mode = "encode"
manifest = "models/codec/manifest_motion_ascend310p1.json"
input_frame_dir = "logs/yolo-alternating/frames"

translation_warp = true
motion_backend = "dvpp"
motion_prefetch_frames = 2
motion_skip_loop_filter = true
motion_camera_nv12 = false

qp = 11
gop = 96
reset_interval = 32
ltr_period = 0
frame_num = 120
fps = 30
device = 0
execution_profile = "pipeline-v1"

output_transport_mode = "rtp"
output_transport_host = "192.168.5.11"
output_transport_port = 39340
output_transport_payload_type = 96
output_transport_pacing_rate_bps = 16000000
output_transport_max_burst_bytes = 1240

# Cumulative encoded ULBVC RTP counters for the Windows comparison UI.
# media_unit_bytes is the ULBVC codec stream; wire_bytes includes RTP/UDP/IP.
ulbvc_stats_host = "192.168.5.2"
ulbvc_stats_port = 39341
ulbvc_stats_interval_frames = 30

# YOLO runs on the same source frame through a separate bounded worker/ACL stream.
detection_enabled = true
detection_model = "models/detection/yolo11s/fp16_opset17/720p/yolo11s_720p_fp16_opset17.om"
detection_labels = "models/detection/yolo11s/fp16_opset17/720p/labels.txt"
detection_report = "logs/detections_alternating.jsonl"
detection_confidence = 0.25
detection_nms_iou = 0.45
detection_queue_capacity = 2

[pipeline]
stream_workers = 1
queue_capacity = 3
frame_buffer_slots = 3
entropy_workers = 1
graph_packet_capacity = 2
